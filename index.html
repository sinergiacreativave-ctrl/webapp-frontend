<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Escolar</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="dashboard" style="text-align: center;">
        <div id="texto-inicio">
            <h2 style="color: #1e3a8a; margin-bottom: 10px;">Portal Escolar</h2>
            <p class="instrucciones-qr">Posiciona el carnet del estudiante frente a la cámara para escanear el código QR</p>
            <button id="btn-escanear" class="btn-escanear">📷 Escanear Carnet</button>
        </div>
        
        <div id="lector-qr" style="margin-top: 15px;"></div>
        <div id="resultado" style="margin-top: 15px;"></div>
    </div>

    <!-- Librería indispensable para el lector QR -->
    <script src="https://unpkg.com/html5-qrcode"></script>
    <script src="script.js"></script>
</body>
</html>
